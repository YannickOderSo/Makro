<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Makro – Erklärvideo (Bühne)</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- gemeinsame Pfeilspitzen für alle Diagramme: marker-end="url(#ah-c1)" usw. -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15223a"/></marker>
    <marker id="ah-mute" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566779"/></marker>
    <marker id="ah-old" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d9aa8"/></marker>
    <marker id="ah-c1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c4bcf"/></marker>
    <marker id="ah-c2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c5263f"/></marker>
    <marker id="ah-c3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0a765d"/></marker>
    <marker id="ah-c4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b86e00"/></marker>
  </defs>
</svg>
<div id="stage"></div>
<script src="vendor/gsap.min.js"></script>
<script>
  // Projekt wählen: index.html?p=<Ordner unter projects/>
  window.PROJECT = new URLSearchParams(location.search).get('p') || 'altklausur';
  document.write('<script src="../projects/' + PROJECT + '/timing.js"><\/script>');
</script>
<script src="engine.js"></script>
<script src="icons.js"></script>
<script>
  for (const s of TIMING.scenes) document.write('<script src="../projects/' + PROJECT + '/scenes/' + s.id + '.js"><\/script>');
</script>
<script>
  V.boot().then(() => {
    const q = new URLSearchParams(location.search);
    if (q.has('play')) V.play(parseFloat(q.get('t') || '0'));
    else if (q.has('t')) seek(parseFloat(q.get('t')));
  }).catch(e => { document.body.insertAdjacentHTML('beforeend', '<pre style="color:#fff;font-size:28px;white-space:pre-wrap">' + e.stack + '</pre>'); window.BOOT_ERROR = String(e.stack || e); });
</script>
</body>
</html>
