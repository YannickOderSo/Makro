<title>Makro Klausur-Checkliste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<style>
/* Layout: eine Spalte auf Karopapier wie die Lernseite; Fortschritt und Filter kleben oben, darunter fünf Blöcke zum Abhaken. */
:root{
  --bg:#f1f5f4; --panel:#fafcfb; --hdr:#f1f5f4; --grid:#d9e6e2;
  --fg:#15223a; --mute:#566779; --line:#c3d0d0; --soft:#e6eeec;
  --c1:#1c4bcf; --c2:#c5263f; --c3:#0a765d; --done-bg:#e2f1ea; --track:#d5dfdd;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1521; --panel:#131c2b; --hdr:#0e1521; --grid:#1b2739;
    --fg:#e3e9f2; --mute:#94a3b6; --line:#2b394e; --soft:#182233;
    --c1:#84aaff; --c2:#ff8195; --c3:#5bd0a8; --done-bg:#11302b; --track:#243247;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1521; --panel:#131c2b; --hdr:#0e1521; --grid:#1b2739;
  --fg:#e3e9f2; --mute:#94a3b6; --line:#2b394e; --soft:#182233;
  --c1:#84aaff; --c2:#ff8195; --c3:#5bd0a8; --done-bg:#11302b; --track:#243247;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px;border-radius:2px}
.wrap{max-width:46rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{background-color:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px;border-bottom:1.5px solid var(--fg)}
.top .wrap{padding-block:26px 20px}
.kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
h1{font-size:clamp(2rem,8vw,3rem);line-height:1.02;letter-spacing:-.025em;font-weight:800;margin:0 0 12px;text-wrap:balance}
h1 span{color:var(--c1)}
.lead{margin:0;max-width:60ch}
.lead b{color:var(--c2)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hdr);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:9px 9px;display:grid;gap:8px}
.prog{display:flex;align-items:center;gap:12px;min-width:0}
.prog-n{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.track{flex:1;height:10px;background:var(--track);min-width:0}
.fill{height:100%;width:0;background:var(--c3)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s}}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters button{font-family:var(--mono);font-size:12.5px;color:var(--fg);border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:3px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sync{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-left:auto;white-space:nowrap}

main.wrap{padding-block:8px 56px}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:3px double var(--fg);padding-top:10px}
.sec-h h2{font-size:1.45rem;line-height:1.15;letter-spacing:-.015em;margin:0;min-width:0;text-wrap:balance}
.sec-n{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.sec-n.all{color:var(--c3)}
.sec-p{margin:4px 0 0;color:var(--mute);font-size:15px;max-width:62ch}
ul.items{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.it{background:var(--panel);border:1.5px solid var(--line);padding:10px 12px 10px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:start}
.it.done{background:var(--done-bg);border-color:var(--c3)}
.it input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:1px 0 0;border:2px solid var(--fg);background:var(--panel);cursor:pointer;display:grid;place-content:center;flex:none}
.it input::after{content:"";width:13px;height:7px;border-left:3px solid var(--panel);border-bottom:3px solid var(--panel);transform:rotate(-45deg) translate(1px,-2px);opacity:0}
.it input:checked{background:var(--c3);border-color:var(--c3)}
.it input:checked::after{opacity:1}
.it label{font-weight:500;cursor:pointer;min-width:0}
.it.done label{color:var(--mute)}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;margin-top:4px;min-width:0}
.tag{font-family:var(--mono);font-size:11.5px;color:var(--mute);border:1px solid var(--line);padding:1px 6px;white-space:nowrap}
.tag.ak{color:var(--c2);border-color:var(--c2);font-weight:700}
.tag.vid{color:var(--c1);border-color:var(--c1)}
details{grid-column:2;min-width:0;margin-top:4px}
summary{font-family:var(--mono);font-size:12.5px;color:var(--c1);cursor:pointer;width:fit-content}
.chk{font-family:var(--mono);font-size:13.5px;line-height:1.55;font-variant-numeric:tabular-nums;background:var(--soft);padding:8px 10px;margin-top:6px;overflow-wrap:anywhere}
.chk div+div{margin-top:3px}
.empty{color:var(--mute);font-style:italic;margin:10px 0 0}
.reset{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14.5px;color:var(--mute)}
.reset button{font-family:var(--mono);font-size:12.5px;color:var(--fg);border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:3px;cursor:pointer}
.reset button.danger{border-color:var(--c2);color:var(--c2)}
sub,sup{font-size:.72em;line-height:0}
</style>

<header class="top"><div class="wrap">
  <p class="kicker">Makroökonomie · Klausur morgen</p>
  <h1>Checkliste: <span>Was du können musst</span></h1>
  <p class="lead">Hak ab, was sitzt. Wenig Zeit? Fang mit dem Filter <b>Altklausur</b> an: Das sind die Themen, die letztes Mal drankamen. Unter „Zur Kontrolle“ stehen die Ergebnisse zum Gegenprüfen.</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="prog"><span class="prog-n" id="prog-n">0 von 0</span><div class="track" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" id="track"><div class="fill" id="fill"></div></div></div>
  <div class="filters">
    <button type="button" id="f-all" data-f="all" aria-pressed="true">Alle</button>
    <button type="button" id="f-ak" data-f="ak" aria-pressed="false">Altklausur</button>
    <button type="button" id="f-open" data-f="open" aria-pressed="false">Nur Offenes</button>
    <span class="sync" id="sync" aria-live="polite"></span>
  </div>
</div></div>

<main class="wrap" id="main"></main>

  { id: 'form', title: 'Formeln auswendig', note: 'Abdecken, aufschreiben, vergleichen.', items: [
    { id: 'f-y', t: 'Y = C + I + G + NX', ref: 'Verwendung' },
    { id: 'f-s', t: 'S = Y − C − G · S privat = Y − T − C · S öffentlich = T − G · geschlossen: S = I', ref: 'Ersparnis' },
    { id: 'f-real', t: 'Reales BIP = Preise des Basisjahres · aktuelle Mengen · Deflator = nominal / real · 100', ref: 'Deflator' },
    { id: 'f-vpi', t: 'VPI = Korb zu heutigen Preisen / Korb zu Basispreisen · 100 · Inflationsrate = (Index heute − Index vorher) / Index vorher', ref: 'VPI' },
    { id: 'f-quant', t: 'M · V = P · Y, in Wachstumsraten: Geldmengenwachstum + 0 = Inflation + reales Wachstum', ref: 'Quantitätsgleichung' },
    { id: 'f-fisher', t: 'i = r + π', ref: 'Fisher' },
    { id: 'f-nx', t: 'NX = S − I(r*) · realer Wechselkurs ε = e · P / P*', ref: 'offene VW' },
    { id: 'f-solow', t: 'Steady State: s · f(k*) = δ · k* · c* = (1 − s) · y*', ref: 'Solow' },
    { id: 'f-mult', t: 'Staatsausgabenmultiplikator 1 / (1 − MPC) · Steuermultiplikator −MPC / (1 − MPC)', ref: 'Multiplikatoren' },
    { id: 'f-islm', t: 'IS: Y = C(Y − T) + I(r) + G · LM: M / P = L(r, Y)', ref: 'IS/LM' },
    { id: 'f-mpl', t: 'Arbeitsnachfrage: MPL = W / P · Arbeitslosenrate = Erwerbslose / Erwerbspersonen', ref: 'Arbeitsmarkt' },

  { id: 'klausur', title: 'In der Klausur', note: '', items: [
    { id: 'k-achsen', t: 'Bei jeder Zeichnung: Achsen beschriften, Kurven benennen, Schnittpunkt mit Hilfslinien' },

    { id: 'k-wortlaut', t: 'Bei Definitionen zuerst den Satz aus dem Skript, dann ein Beispiel' },

const ALL = SECTIONS.flatMap(s => s.items);
const KEY = 'makro-checkliste-v1';
let done = {};          // {itemId: true}
let filter = 'all';
try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }
try { filter = localStorage.getItem(KEY + '-filter') || 'all'; } catch (e) {}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function render() {
  const main = document.getElementById('main');
  const open = new Set([...main.querySelectorAll('details[open]')].map(d => d.dataset.id));
  let html = '';
  for (const s of SECTIONS) {
    const n = s.items.filter(i => done[i.id]).length;
    const vis = s.items.filter(i => filter === 'all' || (filter === 'ak' && i.ak) || (filter === 'open' && !done[i.id]));
    html += '<section class="sec" id="sec-' + s.id + '"><div class="sec-h"><h2>' + s.title + '</h2><span class="sec-n' + (n === s.items.length ? ' all' : '') + '">' + n + ' / ' + s.items.length + '</span></div>';
    if (s.note) html += '<p class="sec-p">' + s.note + '</p>';
    if (!vis.length) html += '<p class="empty">' + (filter === 'open' ? 'Alles abgehakt.' : 'Kein Thema aus der Altklausur in diesem Block.') + '</p>';
    else {
      html += '<ul class="items">';
      for (const i of vis) {
        html += '<li class="it' + (done[i.id] ? ' done' : '') + '"><input type="checkbox" id="cb-' + i.id + '" data-id="' + i.id + '"' + (done[i.id] ? ' checked' : '') + '><label for="cb-' + i.id + '">' + esc(i.t) + '</label>';
        if (i.ak || i.ref || i.vid) html += '<div class="meta">' + (i.ak ? '<span class="tag ak">Altklausur ' + i.ak + '</span>' : '') + (i.ref ? '<span class="tag">' + esc(i.ref) + '</span>' : '') + (i.vid ? '<span class="tag vid">Video ' + esc(i.vid) + '</span>' : '') + '</div>';
        if (i.chk) html += '<details data-id="' + i.id + '"' + (open.has(i.id) ? ' open' : '') + '><summary>Zur Kontrolle</summary><div class="chk">' + i.chk.map(c => '<div>' + esc(c) + '</div>').join('') + '</div></details>';
        html += '</li>';
      }
      html += '</ul>';
    }
    html += '</section>';
  }
  html += '<div class="reset" id="reset"><span>' + ALL.filter(i => i.ak).length + ' der ' + ALL.length + ' Punkte kamen in der letzten Klausur dran.</span><button type="button" id="reset-btn">Alle Haken entfernen</button></div>';
  main.innerHTML = html;
  const n = ALL.filter(i => done[i.id]).length;
  document.getElementById('prog-n').textContent = n + ' von ' + ALL.length;
  document.getElementById('fill').style.width = (100 * n / ALL.length).toFixed(1) + '%';
  const tr = document.getElementById('track'); tr.setAttribute('aria-valuemax', ALL.length); tr.setAttribute('aria-valuenow', n);
  for (const b of document.querySelectorAll('.filters button')) b.setAttribute('aria-pressed', String(b.dataset.f === filter));
}

/* ---------- Speichern: sofort im Browser, zusätzlich im Konto (db), damit die Haken auf jedem Gerät da sind ---------- */
let ref = null, writing = Promise.resolve(), timer = null, dirty = false;
const sync = t => { document.getElementById('sync').textContent = t; };
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }
function saveRemote() {
  if (!ref) return;
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(() => {
    const snapshot = JSON.parse(JSON.stringify(done));
    writing = writing.then(() => ref.set({ done: snapshot, updatedAt: Date.now() }))
      .then(() => { dirty = false; sync('gespeichert'); })
      .catch(() => { sync('nur auf diesem Gerät gespeichert'); });
  }, 500);
}
function setDone(id, v) { if (v) done[id] = true; else delete done[id]; saveLocal(); saveRemote(); render(); }

document.addEventListener('change', e => { const id = e.target && e.target.dataset && e.target.dataset.id; if (id && e.target.type === 'checkbox') setDone(id, e.target.checked); });
document.addEventListener('click', e => {
  const f = e.target.closest && e.target.closest('.filters button');
  if (f) { filter = f.dataset.f; try { localStorage.setItem(KEY + '-filter', filter); } catch (er) {} render(); return; }
  if (e.target.id === 'reset-btn') {
    const box = document.getElementById('reset');
    box.innerHTML = '<span>Wirklich alle ' + ALL.filter(i => done[i.id]).length + ' Haken entfernen?</span><button type="button" class="danger" id="reset-yes">Ja, entfernen</button><button type="button" id="reset-no">Abbrechen</button>';
    return;
  }
  if (e.target.id === 'reset-yes') { done = {}; saveLocal(); saveRemote(); render(); return; }
  if (e.target.id === 'reset-no') render();
});

render();
sync('auf diesem Gerät gespeichert');

(async () => {
  if (!window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db || !user) return;
  const uid = await user.id();
  if (!uid) return;
  ref = db.collection('data/users/' + uid).doc('checkliste');
  let first = true;
  ref.onSnapshot(snap => {
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    const remote = snap.exists ? (snap.data() || {}).done : null;
    if (first) {
      first = false;
      if (!remote) { if (Object.keys(done).length) saveRemote(); else sync('gespeichert'); return; }
    }
    if (remote && !dirty) { done = Object.assign({}, remote); saveLocal(); render(); sync('gespeichert'); }
  }, () => { sync('nur auf diesem Gerät gespeichert'); });
})();
</script>
